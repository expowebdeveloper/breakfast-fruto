<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        h1 {
            color: #555;
        }
        p {
            margin: 10px 0;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dear {{ customer_name }},</h1>
        <p>Your order status has been updated:</p>
        <ul>
            <li><strong>Order ID:</strong> {{ order_id }}</li>
            <li><strong>Previous Status:</strong> {{ previous_status }}</li>
            <li><strong>Current Status:</strong> {{ current_status }}</li>
        </ul>
        <p>Thank you for shopping with us!</p>
        <div class="footer">
            Best regards,<br>
            The Bakery Team
        </div>
    </div>
</body>
</html>
