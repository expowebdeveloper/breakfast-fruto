<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }
        .email-container {
            max-width: 800px;
            margin: 20px auto;
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        .header {
            background-color: #FF6D2F;
            color: #ffffff;
            padding: 20px;
            text-align: center;
            font-size: 24px;
        }
        .body {
            padding: 20px;
            color: #333333;
            line-height: 1.6;
        }
        .button-container {
            text-align: center;
            margin: 20px 0;
        }
        .reset-button {
            background-color: #FF6D2F;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
        }
        .reset-button:hover {
            background-color: #FF6D2F;
        }
        .footer {
            text-align: center;
            padding: 10px;
            background-color: #f9f9f9;
            border-top: 1px solid #ddd;
            font-size: 14px;
            color: #555555;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <div class="header">
            Your Breakfast Shop Account is Ready!
        </div>        
        <div class="body">
            <div class="body">
                <p>Dear {{ email }},</p>
                <p>Welcome to The Breakfast Shop!</p>
                <p>We're excited to have you on board. Here are your account details:</p>
                <p><strong>Email:</strong> {{ email }}</p>
                <p><strong>Password:</strong> {{ password }}</p>
                <p>Thank you for joining us!<br>The Breakfast Shop Team</p>
            </div>
        </div>
        <div class="footer">
            &copy; 2025 Breakfast Shop. All rights reserved.
        </div>
    </div>
</body>
</html>
